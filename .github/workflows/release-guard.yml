# A release with the game's code (a .wasm) or an app built from it
# (Glue5-*) goes back to draft as soon as it is published: published, anyone
# could download them. See docs/github-build.md.
name: Release guard

on:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Notify ntfy (run started)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/ntfy.sh start
      - name: Back to draft
        if: ${{ !github.event.release.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/draft.sh guard "${{ github.event.release.id }}"

      - name: Notify ntfy (run finished)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/ntfy.sh finish
