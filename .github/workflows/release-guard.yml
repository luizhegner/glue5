# A release with the game's code (a file with "wasm" in its name) or an app
# built from it (Glue5-*) goes back to draft as soon as it is published:
# published, anyone could download them. See docs/github-build.md. On a
# push, or by hand, every release is looked at: also those published before
# the guard was in the fork, or while its workflows were off.
name: Release guard

on:
  release:
    types: [published, edited]
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Test game asset selection with synthetic release metadata
        shell: bash
        run: |
          selector=.github/scripts/select-game-asset.jq
          choose() { jq -cn --argjson assets "$1" '{assets:$assets}' | jq -r --argjson sizes '[63201802]' -f "$selector"; }
          test "$(choose '[{"state":"uploaded","name":"game.wasm","size":63201802},{"state":"uploaded","name":"game-r5.wasm","size":63203467}]' | jq -r .name)" = game.wasm
          test -z "$(choose '[{"state":"uploaded","name":"a.wasm","size":63201802},{"state":"uploaded","name":"b.wasm","size":63201802}]')"
          test "$(choose '[{"state":"uploaded","name":"game.wasm.gz","size":123}]' | jq -r .name)" = game.wasm.gz
      - name: Notify ntfy (run started)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/ntfy.sh start
      - name: Back to draft
        if: ${{ !github.event.release.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
        # Without a release in the event (a push, by hand): all of them.
        run: .github/scripts/draft.sh guard "${{ github.event.release.id }}"

      - name: Notify ntfy (run finished)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/ntfy.sh finish
