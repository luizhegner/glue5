[package]
name = "glue5-resource-api"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
aes = "=0.8.4"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

