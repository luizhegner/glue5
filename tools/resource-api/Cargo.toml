[package]
name = "glue5-resource-api"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
aes = "=0.8.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = ">=0.10, <0.12"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

