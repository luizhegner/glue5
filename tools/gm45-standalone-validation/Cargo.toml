[package]
name = "glue5-gpu-d3d11"
version = "0.1.0"
edition = "2024"

[lib]
path = "../../crates/glue5-gpu-d3d11/src/lib.rs"

[[example]]
name = "gm45_probe"
path = "../../crates/glue5-gpu-d3d11/examples/gm45_probe.rs"

[dependencies]
anyhow = "1"
log = "0.4"
glue5-runtime = { path = "glue5-runtime" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }


[[example]]
name = "gm45_present_probe"
path = "../../crates/glue5-gpu-d3d11/examples/gm45_present_probe.rs"




[workspace]

[[example]]
name = "gm45_sm4_draw_probe"
path = "../../crates/glue5-gpu-d3d11/examples/gm45_sm4_draw_probe.rs"
