[package]
name = "glue5"
description = "Glue 5: runs the game natively on desktop and mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Paths are relative to this manifest. Game data is deliberately external.
# Version and executable are taken from Cargo by cargo-packager.
[package.metadata.packager]
product-name = "Glue 5"
identifier = "local.glue5"
category = "Game"
formats = ["app"]
out-dir = "../../target/package"
# Made by macos:build and linux:package; each system's formats take theirs
# (an .icns on macOS, PNGs on Linux) and a missing one matches nothing.
icons = ["../../target/package/macos-assets/Glue5.icns", "../../target/package/linux-assets/glue5.png"]
resources = [{ src = "../../target/package/macos-assets/Assets.car", target = "Assets.car" }]

[package.metadata.packager.macos]
minimum-system-version = "14.0"
info-plist-path = "../../platform/macos/Info.plist"
# No signing identity: no bundle signing or notarization.

[dependencies]
glue5-runtime.workspace = true
glue5-stream.workspace = true
glue5-gpu.workspace = true
glue5-mods.workspace = true
qrcode = { version = "0.14", default-features = false }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
egui.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
wgpu.workspace = true
png = "0.18"

[dev-dependencies]
# The headless example's command line.
clap = { version = "4", features = ["derive", "env"] }

# SDL, built from its sources and linked in; on Android a shared library of
# its own next to ours (libSDL3.so), as SDL's Java side expects: it registers
# its native methods from its JNI_OnLoad, which a Rust cdylib would not export.
[target.'cfg(not(target_os = "android"))'.dependencies]
sdl3 = { version = "0.20", features = ["build-from-source-static", "raw-window-handle", "mixer"] }

# The binaries' allocator on Windows (see src/main.rs).
[target.'cfg(windows)'.dependencies]
mimalloc = "0.1"
# The computer's name (device.rs).
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[target.'cfg(target_os = "android")'.dependencies]
sdl3 = { version = "0.20", features = ["build-from-source", "raw-window-handle", "mixer", "hidapi"] }
# Keep SDL3_mixer inside libglue5.so; Android packages SDL3 itself separately for Java.
# GLUE 5 only needs MP3 menu music; don't build the unused MOD/libxmp backend
# (its version-script link currently fails with Android NDK's lld).
sdl3-mixer-sys = { version = "0.7", default-features = false, features = ["build-static-vendored", "no-default-mod"] }
# Logs to logcat (stderr goes nowhere there).
android_logger = { version = "0.15", default-features = false }
# The Android document picker lives in the Java activity. Rust asks it to
# open through SDL's JNI environment, then installs the staged files.
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
# The Taptic Engine, for the touch controls' haptics (UIKit and CoreHaptics
# are linked already).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSGeometry", "NSProcessInfo", "NSString", "NSURL", "NSValue"] }
# The on-screen keyboard's notifications (keyboard.rs).
block2 = "0.6"
objc2-core-haptics = { version = "0.3", default-features = false, features = [
    "std",
    "CHHapticDeviceCapability",
    "CHHapticEngine",
    "CHHapticEvent",
    "CHHapticParameter",
    "CHHapticPattern",
    "CHHapticPatternPlayer",
] }
