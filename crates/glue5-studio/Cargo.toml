[package]
name = "glue5-studio"
description = "GLUE 5 Studio's web page: Leptos (compiled to wasm by glue5-mods' build script) around a CodeMirror editor"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace: built for wasm32 only, by glue5-mods' build script.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# The same version as glue5-mods' wasm-bindgen-cli-support (build.rs).
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CloseEvent", "Document", "Element", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Location",
    "MessageEvent", "Storage", "UrlSearchParams", "WebSocket", "Window", "BinaryType", "Navigator", "Clipboard",
    "MediaQueryList", "MediaQueryListEvent", "DragEvent", "DataTransfer",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
