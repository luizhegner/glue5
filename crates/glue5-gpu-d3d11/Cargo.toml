[package]
name = "glue5-gpu-d3d11"
description = "Native D3D11 backend primitives for GLUE5 (Windows only)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
runtime-integration = ["native-ring", "dep:glue5-runtime"]
native-ring = ["dep:glue5-ring"]
wgsl-catalog = ["native-ring", "dep:naga", "dep:sha2"]

[dependencies]
anyhow.workspace = true
glue5-runtime = { workspace = true, optional = true }
glue5-ring = { package = "naga-hlsl-probe", path = "../../tools/naga-hlsl-probe", default-features = false, optional = true }
naga = { version = "=30.0.1", features = ["wgsl-in", "hlsl-out"], optional = true }
sha2 = { workspace = true, optional = true }
log.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
