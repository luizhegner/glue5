[package]
name = "glue5-stream"
description = "The game's files over the network: a server for a game folder, a client with a local cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "glue5-serve"
path = "src/main.rs"

[dependencies]
glue5-qos.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Each chunk's checksum (SIMD, several GB/s).
crc32fast = "1"
# Small files and shaders travel as one compressed pack each; multithreaded
# compression makes the server's first pack build a matter of seconds.
zstd = { version = "0.14", default-features = false, features = ["zstdmt"] }

# The mDNS responder's socket: port 5353 shared with the system's
# responder, multicast on each interface (Linux and Windows servers).
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Ioctl"] }
