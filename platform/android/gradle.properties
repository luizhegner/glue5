# The Android SDK packages the app is built with; the android tasks install
# them with sdkmanager (.mise/tasks/android/lib.sh reads them here).
glue5.compileSdk=36
# Keep targetSdk separate: it changes runtime behavior, while compileSdk only
# selects APIs available to the build.
glue5.targetSdk=36
glue5.buildTools=36.0.0
glue5.ndk=29.0.14206865
# Android 11: MANAGE_EXTERNAL_STORAGE and the all-files access flow (API 30).
glue5.minSdk=30
android.useAndroidX=true

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
